<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#222222">클라이언트 로그의 큐잉(Queuing)과 재전송 구조</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#666666">at-least-once delivery가 유실과 중복을 동시에 만드는 이유</text>

  <!-- Box 1: 이벤트 발생 -->
  <rect x="30" y="260" width="140" height="70" rx="8" fill="#f0f0f0" stroke="#c9c9c9"/>
  <text x="100" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">이벤트 발생</text>
  <text x="100" y="310" text-anchor="middle" font-size="11" fill="#555555">사용자 행동</text>

  <!-- Arrow 1->2 -->
  <line x1="170" y1="295" x2="212" y2="295" stroke="#333333" stroke-width="2"/>
  <polygon points="212,295 200,290 200,300" fill="#333333"/>

  <!-- Box 2: 로컬 큐 (강조) -->
  <rect x="214" y="220" width="220" height="150" rx="8" fill="#dceaf7" stroke="#b7d3ec" stroke-width="2"/>
  <text x="324" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#1f5c94">로컬 큐(Queue) 적재</text>
  <text x="234" y="276" font-size="11" fill="#33689a">· 이벤트를 서버로 보내기 전,</text>
  <text x="234" y="294" font-size="11" fill="#33689a">  기기 안에 임시로 쌓아두는 저장소</text>
  <text x="234" y="316" font-size="11" fill="#33689a">· 전송이 확인(ACK)될 때까지 보관</text>
  <text x="234" y="338" font-size="11" fill="#33689a">· 앱을 백그라운드로 보내거나</text>
  <text x="234" y="356" font-size="11" fill="#33689a">  꺼도 큐 자체는 유지된다</text>

  <!-- Arrow 2->3 -->
  <line x1="434" y1="295" x2="476" y2="295" stroke="#333333" stroke-width="2"/>
  <polygon points="476,295 464,290 464,300" fill="#333333"/>

  <!-- Box 3: 전송 시도 -->
  <rect x="478" y="260" width="140" height="70" rx="8" fill="#f0f0f0" stroke="#c9c9c9"/>
  <text x="548" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">전송 시도</text>
  <text x="548" y="310" text-anchor="middle" font-size="11" fill="#555555">서버로 네트워크 전송</text>

  <!-- Branch success -->
  <line x1="618" y1="270" x2="666" y2="200" stroke="#2f6b3f" stroke-width="2"/>
  <polygon points="666,200 652,201 658,213" fill="#2f6b3f"/>
  <text x="596" y="228" text-anchor="middle" font-size="11" fill="#2f6b3f">서버 ACK 수신</text>

  <!-- Box 4: 성공 -->
  <rect x="668" y="130" width="200" height="80" rx="8" fill="#e8f3ea" stroke="#c9ded0"/>
  <text x="768" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6b3f">큐에서 제거</text>
  <text x="768" y="178" text-anchor="middle" font-size="11" fill="#4a7a58">전송 완료로 처리</text>
  <text x="768" y="196" text-anchor="middle" font-size="10" fill="#4a7a58">(정상 케이스)</text>

  <!-- Branch fail -->
  <line x1="618" y1="320" x2="666" y2="380" stroke="#b8792f" stroke-width="2"/>
  <polygon points="666,380 654,373 660,385" fill="#b8792f"/>
  <text x="588" y="355" text-anchor="middle" font-size="11" fill="#b8792f">전송 실패 /</text>
  <text x="588" y="370" text-anchor="middle" font-size="11" fill="#b8792f">응답 없음</text>

  <!-- Box 5: 재시도 대기 -->
  <rect x="668" y="330" width="212" height="100" rx="8" fill="#fdf1e2" stroke="#eccb96"/>
  <text x="774" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#a1701f">재시도 대기 (백오프)</text>
  <text x="686" y="378" font-size="10" fill="#a1701f">※ 서버는 정상 처리했지만</text>
  <text x="686" y="393" font-size="10" fill="#a1701f">ACK 응답만 유실된 경우도 포함</text>
  <text x="686" y="408" font-size="10" fill="#a1701f">&#8594; 재전송 시 서버에 동일 이벤트가</text>
  <text x="686" y="421" font-size="10" fill="#a1701f">중복 적재된다 (중복 카운트 원인)</text>

  <!-- Loop back arrow from Box5 to Box3 -->
  <path d="M 668 355 C 560 480, 500 400, 548 332" fill="none" stroke="#b8792f" stroke-width="1.6" stroke-dasharray="4,3"/>
  <polygon points="548,332 543,346 556,343" fill="#b8792f"/>
  <text x="560" y="470" text-anchor="middle" font-size="10" fill="#b8792f">일정 시간 뒤 재전송 시도</text>

  <!-- Arrow Box5 down to Box6 -->
  <line x1="774" y1="430" x2="774" y2="470" stroke="#a13d3d" stroke-width="2"/>
  <polygon points="774,470 768,458 780,458" fill="#a13d3d"/>
  <text x="774" y="450" text-anchor="middle" font-size="10" fill="#a13d3d">장시간 미해결 + 앱 종료/재설치</text>

  <!-- Box 6: 유실 -->
  <rect x="650" y="472" width="248" height="70" rx="8" fill="#f6f6f6" stroke="#d6d6d6" stroke-dasharray="5,4"/>
  <text x="774" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#777777">큐 유실</text>
  <text x="774" y="520" text-anchor="middle" font-size="11" fill="#888888">이벤트가 최종적으로 서버에 도달하지 못함</text>

  <!-- Bottom annotation -->
  <rect x="20" y="400" width="410" height="140" rx="8" fill="#fbe6e6" stroke="#f0c2c2"/>
  <text x="225" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#a13d3d">큐잉은 유실을 줄이려는 설계지만,</text>
  <text x="225" y="448" text-anchor="middle" font-size="13" font-weight="700" fill="#a13d3d">그 대가로 중복과 지연을 만든다</text>
  <text x="45" y="472" font-size="11" fill="#a1544d">DB 트랜잭션처럼 즉시 커밋·롤백되지 않고,</text>
  <text x="45" y="490" font-size="11" fill="#a1544d">"확인될 때까지 재시도"하는 구조이기 때문에</text>
  <text x="45" y="508" font-size="11" fill="#a1544d">같은 이벤트가 중복 집계되거나(재전송),</text>
  <text x="45" y="526" font-size="11" fill="#a1544d">아예 누락되는(큐 유실) 두 방향의 오차가 동시에 생긴다</text>
</svg>
